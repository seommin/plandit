services:
  web:
    build:
      context: .
      target: dev
    command: sh -c "pnpm prisma:generate && pnpm dev --hostname 0.0.0.0"
    environment:
      NODE_ENV: development
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-development-secret-change-me
      AUTH_SECRET: local-development-secret-change-me
      DATABASE_URL: postgresql://plandit:plandit@postgres:5432/plandit
      DIRECT_URL: postgresql://plandit:plandit@postgres:5432/plandit
      CI: "true"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: plandit
      POSTGRES_USER: plandit
      POSTGRES_PASSWORD: plandit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plandit -d plandit"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  web_node_modules:
  web_next:
